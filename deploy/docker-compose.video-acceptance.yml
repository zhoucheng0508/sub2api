# Isolated manual-acceptance environment. Never uses production volumes.
name: sub2api-video-acceptance
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sub2api_video_acceptance
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: video-acceptance-local-only
    volumes:
      - video-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sub2api -d sub2api_video_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    image: ${SUB2API_IMAGE:?Set SUB2API_IMAGE to the release image under validation}
    ports:
      - "127.0.0.1:18088:8080"
    volumes:
      - video-app:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: video-acceptance-local-only
      DATABASE_DBNAME: ${VIDEO_ACCEPTANCE_DB:-sub2api_video_acceptance}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ADMIN_EMAIL: video-acceptance@local.test
      ADMIN_PASSWORD: ${VIDEO_ACCEPTANCE_ADMIN_PASSWORD:-VideoAcceptance-Local-2026!}
      JWT_SECRET: video-acceptance-local-only-jwt-secret-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  video-db:
  video-app:
