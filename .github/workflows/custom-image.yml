name: Build custom Docker image

on:
  push:
    tags:
      - "custom-v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and resolve version
        id: release
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^custom-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Invalid custom image tag: ${GITHUB_REF_NAME}"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          FILE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          if [[ "${VERSION}" != "${FILE_VERSION}" ]]; then
            echo "Tag version ${VERSION} does not match backend version ${FILE_VERSION}"
            exit 1
          fi

          git fetch origin custom --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/custom; then
            echo "Tagged commit is not part of the custom branch"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
